<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAR Production Delivery Manifest Validator</title><meta name="description" content="Validate a rights-labelled production delivery manifest locally in your browser."><style>body{font:16px system-ui;margin:0;background:#10131d;color:#eef2ff}main{max-width:860px;margin:auto;padding:32px}textarea{width:100%;min-height:280px;background:#181d2b;color:#eef2ff;border:1px solid #59627e;border-radius:8px;padding:12px;font:13px ui-monospace}button{margin:14px 0;padding:10px 16px;background:#89d5ff;border:0;border-radius:6px;font-weight:700}pre{white-space:pre-wrap;padding:12px;background:#181d2b;border-radius:8px}a{color:#89d5ff}</style><link rel="canonical" href="https://sharproduction.github.io/production-delivery-manifest-validator/"><meta name="robots" content="index,follow"></head><body><main><h1>Delivery manifest validator</h1><p>SHAR Production is an AI-hybrid video production studio. This demo runs only in your browser.</p><textarea id="manifest">{"project_id":"demo","delivery_id":"master-v1","files":[{"path":"master.mp4","sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}],"rights":{"status":"cleared","evidence_url":"https://example.com/rights"}}</textarea><br><button id="validate">Validate manifest</button><pre id="result" aria-live="polite"></pre><p>Source: <a href="https://github.com/SHARProduction/production-delivery-manifest-validator">MIT CLI</a> · Fixtures: <a href="https://huggingface.co/datasets/SHARProduction/production-delivery-manifest-fixtures">CC-BY-4.0 synthetic dataset</a> · <a href="https://sharprod.com/">sharprod.com</a></p></main><script>const out=document.querySelector('#result');document.querySelector('#validate').onclick=()=>{try{const x=JSON.parse(document.querySelector('#manifest').value),e=[];for(const k of ['project_id','delivery_id','files','rights'])if(!(k in x))e.push('missing '+k);if(!Array.isArray(x.files)||!x.files.length)e.push('files must be a non-empty array');else x.files.forEach((f,i)=>{if(!f?.path)e.push('files['+i+'].path required');if(!/^[a-f0-9]{64}$/i.test(f?.sha256||''))e.push('files['+i+'].sha256 must be SHA-256')});if(!x.rights||!['cleared','restricted','unknown'].includes(x.rights.status))e.push('rights.status must be cleared, restricted, or unknown');else if(x.rights.status!=='cleared')e.push('release blocked: rights.status is '+x.rights.status);if(!/^https:\/\//.test(x.rights?.evidence_url||''))e.push('rights.evidence_url must be HTTPS');out.textContent=JSON.stringify({valid:!e.length,errors:e},null,2)}catch(err){out.textContent=JSON.stringify({valid:false,errors:[err.message]},null,2)}};</script></body></html>
